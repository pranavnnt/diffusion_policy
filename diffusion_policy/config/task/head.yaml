name: head_dressing

obs_dim: 23
action_dim: 6
keypoint_dim: 0
obs_eef_target: False

dataset:
  _target_: diffusion_policy.dataset.head_dressing.HeadDressingDataset
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  obs_key: state
  num_datasets: 1
  include_datasets: ["real"]
  action_key: action
  use_domain_encoding: False    # disabled by default 
  domain_encoding_dim: 2
  seed: 42
  zarr_configs:
    - path: /home/sj887/Jan19_combined_head.zarr
      name: real
      max_train_episodes: null
      sampling_weight: 1.0
      val_ratio: 0.02
